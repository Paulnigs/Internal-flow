services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_pro
    ports:
      - "5432:5432"
    volumes:
      - studio_pro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_pro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studio_pro_pg:
